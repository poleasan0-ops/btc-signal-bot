
name: BTC Historical Data Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Coinbase historical data
        run: python backtest.py
